<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="board-page ra-page-shell">
    <header class="angel-header ra-page-pad">
      <div class="header-text">
        <h1>Open requests</h1>
        <p>Ride requests from people in your trusted circle</p>
      </div>
      <span class="angel-mode">
        <span class="ra-icon-box" style="width:10px;height:10px">
          <img class="ra-icon" src="assets/icons/shield.svg" alt="" />
        </span>
        ANGEL MODE
      </span>
    </header>

    <section class="feed ra-page-pad">
      @for (item of items(); track item.rideRequestId) {
        <app-claim-board-card
          [item]="item"
          (open)="openAppointment(item.appointmentId)"
        />
      } @empty {
        <p class="empty">
          No open requests from your circle right now. Confirmed trips stay under
          Upcoming drives on Home.
        </p>
      }
    </section>
  </div>
</ion-content>
