<ion-content [fullscreen]="true" class="onboarding-content">
  <div class="onboarding">
    <div class="hero">
      <app-brand-logo variant="splash" maxWidth="220px" />
      <p>Tell us a little about you so we can set up your Ride Angels profile.</p>
    </div>

    <section class="name-fields">
      <label>
        First name
        <input type="text" autocomplete="given-name" [(ngModel)]="firstName" />
      </label>
      <label>
        Last name
        <input type="text" autocomplete="family-name" [(ngModel)]="lastName" />
      </label>
    </section>

    <section class="chooser">
      <h2>How will you use Ride Angels?</h2>
      <p class="hint">
        Pick one to start. You’ll open the app in that role. If your situation
        changes later, you can switch in Profile.
      </p>

      <button
        type="button"
        class="persona ra-reset"
        [class.active]="selected() === 'rider'"
        (click)="select('rider')"
      >
        <span class="persona-copy">
          <strong>I’m a Rider</strong>
          <span>I need rides to appointments</span>
        </span>
      </button>

      <button
        type="button"
        class="persona ra-reset"
        [class.active]="selected() === 'angel'"
        (click)="select('angel')"
      >
        <span class="persona-copy">
          <strong>I’m a Ride Angel</strong>
          <span>I drive family or friends to appointments</span>
        </span>
      </button>
    </section>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="cta">
      <app-primary-button
        [label]="saving() ? 'Saving…' : 'Continue'"
        [disabled]="saving()"
        (pressed)="continue()"
      />
    </div>
  </div>
</ion-content>
