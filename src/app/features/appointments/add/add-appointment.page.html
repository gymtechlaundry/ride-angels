<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="add-page ra-page-shell ra-page-shell--flush-top">
    <app-page-header
      [title]="editingId() ? 'Edit appointment' : 'Add appointment'"
      [subtitle]="
        editingId()
          ? 'Update trip details for your Ride Angels'
          : 'Set your destination and trip details'
      "
      [showBack]="true"
    />

    <form class="form ra-page-pad" [formGroup]="form" (ngSubmit)="save()">
      <label class="field">
        <span class="label">Appointment Title</span>
        <div class="input-wrap">
          <span class="ra-icon-box" style="width:16px;height:16px">
            <img class="ra-icon" src="assets/icons/calendar.svg" alt="" />
          </span>
          <input
            formControlName="title"
            type="text"
            placeholder="e.g. Doctor visit"
            autocomplete="off"
          />
        </div>
      </label>

      <app-date-time-field
        label="Pickup"
        mode="date-time"
        iconSrc="assets/icons/clock.svg"
        placeholder="When should your Ride Angel arrive?"
        [date]="form.controls.date.value"
        [time]="form.controls.time.value"
        [min]="minDate"
        (dateChange)="onAppointmentDateChange($event)"
        (timeChange)="onAppointmentTimeChange($event)"
      />

      <section class="optional-module">
        <div class="toggle-header">
          <div class="toggle-label">
            <span class="ra-icon-box" style="width:16px;height:16px">
              <img class="ra-icon" src="assets/icons/clock.svg" alt="" />
            </span>
            <span>Appointment starts at</span>
          </div>
          <ion-toggle
            [checked]="hasAppointmentStart()"
            (ionChange)="onAppointmentStartToggle($any($event).detail.checked)"
            aria-label="Add appointment start time"
          ></ion-toggle>
        </div>
        <p class="help">
          Optional — when you need to be at the clinic or destination.
        </p>

        @if (hasAppointmentStart()) {
          <app-date-time-field
            class="nested"
            label="Appointment start"
            mode="time"
            iconSrc="assets/icons/clock.svg"
            placeholder="Choose start time"
            [date]="form.controls.date.value"
            [time]="form.controls.appointmentStartTime.value"
            (timeChange)="onAppointmentStartTimeChange($event)"
          />
        }
      </section>

      <app-address-autocomplete
        label="Pickup Address (From)"
        placeholder="Start typing a pickup address"
        autocompleteAttr="off"
        [value]="form.controls.pickupAddress.value"
        (valueChange)="onPickupText($event)"
        (placeSelected)="onPickupPlace($event)"
      />

      <label class="field nickname-field">
        <span class="label">Pickup nickname (optional)</span>
        <div class="input-wrap">
          <input
            formControlName="pickupNickname"
            type="text"
            placeholder="e.g. Home"
            maxlength="40"
            autocomplete="off"
          />
        </div>
        <div class="nickname-chips" role="group" aria-label="Pickup nickname suggestions">
          @for (chip of nicknameSuggestions; track chip) {
            <button
              type="button"
              class="nickname-chip ra-reset"
              [class.active]="form.controls.pickupNickname.value === chip"
              (click)="applyPickupNickname(chip)"
            >
              {{ chip }}
            </button>
          }
        </div>
      </label>

      <app-address-autocomplete
        label="Destination Address (To)"
        placeholder="Start typing a destination"
        autocompleteAttr="off"
        [value]="form.controls.destinationAddress.value"
        (valueChange)="onDestinationText($event)"
        (placeSelected)="onDestinationPlace($event)"
      />

      <label class="field nickname-field">
        <span class="label">Destination nickname (optional)</span>
        <div class="input-wrap">
          <input
            formControlName="destinationNickname"
            type="text"
            placeholder="e.g. Clinic"
            maxlength="40"
            autocomplete="off"
          />
        </div>
        <div
          class="nickname-chips"
          role="group"
          aria-label="Destination nickname suggestions"
        >
          @for (chip of nicknameSuggestions; track chip) {
            <button
              type="button"
              class="nickname-chip ra-reset"
              [class.active]="form.controls.destinationNickname.value === chip"
              (click)="applyDestinationNickname(chip)"
            >
              {{ chip }}
            </button>
          }
        </div>
      </label>

      <label class="field">
        <span class="label">Notes for your Ride Angel (optional)</span>
        <div class="textarea-wrap">
          <textarea
            formControlName="notes"
            rows="3"
            maxlength="500"
            placeholder="e.g. Wheelchair assist, building entrance on the side"
          ></textarea>
        </div>
      </label>

      <section class="return-module">
        <div class="toggle-header">
          <div class="toggle-label">
            <span class="ra-icon-box" style="width:16px;height:16px">
              <img class="ra-icon" src="assets/icons/calendar-sync.svg" alt="" />
            </span>
            <span>Add Return Trip</span>
          </div>
          <ion-toggle
            [checked]="returnNeeded()"
            (ionChange)="onReturnToggle($any($event).detail.checked)"
            aria-label="Add return trip"
          ></ion-toggle>
        </div>

        @if (returnNeeded()) {
          <app-date-time-field
            class="nested"
            label="Return Pickup Time"
            mode="time"
            iconSrc="assets/icons/clock.svg"
            placeholder="Choose return time"
            [date]="form.controls.date.value"
            [time]="form.controls.returnPickupTime.value"
            (timeChange)="onReturnTimeChange($event)"
          />
        }
      </section>

      <div class="actions">
        <app-primary-button
          [label]="editingId() ? 'Save Changes' : 'Schedule & Notify Angels'"
          (pressed)="save()"
        />
      </div>
    </form>
  </div>
</ion-content>
